name: Etuki Gate Self-Test CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  verify_12_boundary_vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Published SHA-256 Checksum of etuki-gate.mjs
        run: |
          ACTUAL_SHA=$(sha256sum etuki-gate.mjs | awk '{print $1}')
          echo "etuki-gate.mjs SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "749c238f7b4687997260572ef1a3e35075ab31f37e5dd045af232f03cd5ff9a2"
      - name: Run 12 Deterministic Boundary & Fail-Closed Vectors (Node 22)
        run: node etuki-gate.mjs --test
